<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Adventure! ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }
        #instruction {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

<script type="module">
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

    // 1. Initialize Game
    kaboom({
        background: [135, 206, 235],
        scale: 1,
    });

    // 2. Load Assets
    loadSprite("player", "haruna.png");
    loadSprite("joe", "joe.png");
    
    // 3. Main Game Scene
    scene("main", () => {
        
        setGravity(2000);

        onClick(() => {
            const instr = document.getElementById("instruction");
            if (instr) instr.style.display = "none";
        });

        // Level Layout
        // @ : Joe character sprite
        // ! : The Goal
        
        const levelLayout = [
            "                                                                     ",
            "                                                                     ",
            "                                   @ ",
            "                                 ===                                 ",
            "                                                                     ",
            "                  @ ===                 ===                    ",
            "                ====                                  !              ",
            "                                                    =====            ",
            "       @ ==                                   #######           ",
            "     ====                 ===         ===         #########          ",
            "                                                 ###########         ",
            "===========  ================   ============================  =======",
            "###########  ################   ############################  #######",
            "###########  ################   ############################  #######",
        ];

        const messages = [
            "I love you so much! <3", 
            "You make me the happiest person.",
            "Keep going! Almost there!"
        ];

        let messageIndex = 0;

        // Define the Map
        addLevel(levelLayout, {
            tileWidth: 48,
            tileHeight: 48,
            tiles: {
                "=": () => [ 
                    rect(48, 48), 
                    color(34, 139, 34),
                    outline(4, color(20, 100, 20)),
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                "#": () => [ 
                    rect(48, 48), 
                    color(139, 69, 19),
                    outline(4, color(100, 50, 10)), 
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                // Joe character
                "@": () => [ 
                    sprite("joe"), 
                    scale(0.5),
                    anchor("bot"), 
                    area({ scale: 0.8 }), 
                    body({ isStatic: true }),
                    "joe", 
                    { 
                        msg: messages[messageIndex++ % messages.length],
                        hasSpoken: false 
                    }
                ],
                "!": () => [ 
                    rect(50, 50), 
                    color(255, 215, 0), 
                    outline(4, color(255, 255, 255)),
                    anchor("center"), 
                    area(), 
                    body({ isStatic: true }), 
                    "goal",
                    {
                        update() {
                            this.angle += 120 * dt();
                        }
                    }
                ]
            }
        });

        // --- PLAYER ---
        const player = add([
            sprite("player"),
            pos(100, 200),
            area({ scale: 0.8 }),
            body(),
            anchor("bot"),
            scale(0.5),
            "player"
        ]);

        // Camera Follow
        player.onUpdate(() => {
            camPos(player.pos.x, 400);
            
            if (player.pos.y > 1000) {
                go("lose");
            }
        });

        // --- CONTROLS ---
        const SPEED = 400;
        const JUMP_FORCE = 900;

        onKeyDown("left", () => {
            player.move(-SPEED, 0);
            player.flipX = true;
        });
        onKeyDown("a", () => {
            player.move(-SPEED, 0);
            player.flipX = true;
        });

        onKeyDown("right", () => {
            player.move(SPEED, 0);
            player.flipX = false;
        });
        onKeyDown("d", () => {
            player.move(SPEED, 0);
            player.flipX = false;
        });

        function jump() {
            if (player.isGrounded()) {
                player.jump(JUMP_FORCE);
            }
        }

        onKeyPress("space", jump);
        onKeyPress("w", jump);
        onKeyPress("up", jump);

        // --- SPEECH BUBBLE ---
        let currentBubble = null;
        let currentBubbleText = null;

        function createSpeechBubble(joeObj, message) {
            // Remove existing bubble if any
            if (currentBubble) {
                destroy(currentBubble);
                destroy(currentBubbleText);
            }

            // Create bubble background
            currentBubble = add([
                rect(300, 100, { radius: 8 }),
                anchor("bot"),
                pos(joeObj.pos.x, joeObj.pos.y - 80),
                color(255, 255, 255),
                outline(3, color(0, 0, 0)),
                z(50)
            ]);

            // Create bubble text
            currentBubbleText = add([
                text(message, { size: 18, width: 280, align: "center" }),
                anchor("center"),
                pos(joeObj.pos.x, joeObj.pos.y - 130),
                color(0, 0, 0),
                z(51)
            ]);

            // Auto-hide after 4 seconds
            wait(4, () => {
                if (currentBubble) {
                    destroy(currentBubble);
                    destroy(currentBubbleText);
                    currentBubble = null;
                    currentBubbleText = null;
                }
            });
        }

        // Interaction with Joe
        player.onCollide("joe", (joeObj) => {
            if (!joeObj.hasSpoken) {
                createSpeechBubble(joeObj, joeObj.msg);
                joeObj.hasSpoken = true;
            }
        });

        // Win
        player.onCollide("goal", () => {
            go("win");
        });
    });

    // Lose Scene
    scene("lose", () => {
        add([
            text("Oops! You fell.", { size: 48 }),
            pos(center()),
            anchor("center"),
        ]);
        add([
            text("Press Space to Try Again", { size: 24 }),
            pos(center().x, center().y + 100),
            anchor("center"),
        ]);
        onKeyPress("space", () => go("main"));
    });

    // Celebration Scene
    scene("win", () => {
        function spawnConfetti() {
            add([
                rect(rand(10, 20), rand(10, 20)),
                pos(rand(0, width()), rand(0, height())),
                color(rand(0, 255), rand(0, 255), rand(0, 255)),
                area(),
                move(DOWN, rand(50, 200)),
                offscreen({ destroy: true }),
            ]);
            wait(0.05, spawnConfetti);
        }
        spawnConfetti();

        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center", width: width() - 50 }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        
        add([
            text("Press Space to Replay", { size: 24 }),
            pos(center().x, center().y + 100),
            anchor("center"),
            color(0, 0, 0)
        ]);

        onKeyPress("space", () => go("main"));
    });

    // Start
    go("main");
    focus();

</script>
</body>
</html>
