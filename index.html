<!DOCTYPE html>
<html>
<head>
    <title>Birthday Quest ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #333; }
    </style>
</head>
<body>

<script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>

<script>
    // 1. Initialize Game
    kaboom({
        background: [135, 206, 235], // Sky Blue
        scale: 1.5,
        global: true, // This makes all functions (add, scene, etc.) work globally
    });

    // 2. Define Main Scene
    scene("main", () => {
        
        // Setup Physics
        setGravity(2000);

        // --- LEVEL LAYOUT ---
        const levelLayout = [
            "                                      ",
            "                                      ",
            "           B                          ",
            "       =========                      ",
            "                                      ",
            "                       B              ",
            "                   ========           ",
            "      B                               ",
            "======================================",
            "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
        ];

        const boyfriendMessages = [
            "Happy Birthday! Keep going! -->",
            "You look beautiful today! <3",
            "Almost there! Surprise at the end!",
        ];
        let messageIndex = 0;

        // Draw the Level
        addLevel(levelLayout, {
            tileWidth: 40,
            tileHeight: 40,
            tiles: {
                "=": () => [ 
                    rect(40, 40), 
                    color(34, 139, 34), // Green Ground
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                "^": () => [ 
                    rect(40, 40), 
                    color(255, 0, 0), // Red Spikes
                    area(), 
                    body({ isStatic: true }), 
                    "hazard" 
                ],
                "B": () => [
                    rect(30, 50), 
                    color(0, 0, 255), // Blue Boyfriend 
                    area(),
                    body({ isStatic: true }),
                    anchor("bot"), 
                    "boyfriend",
                    { hasSpoken: false } 
                ]
            }
        });

        // --- PLAYER ---
        const player = add([
            rect(30, 50),       // Hitbox (invisible-ish)
            color(0,0,0,0),     // Transparent
            pos(100, 0),        // Start in air
            area(), 
            body({ jumpForce: 900 }), 
            anchor("bot"), 
            "player",
            { speed: 300 }
        ]);

        // --- CUSTOM DRAWING (The Girlfriend) ---
        // This is the v3000 way that was failing in the old version
        player.onDraw(() => {
            // Black Top
            drawRect({ width: 30, height: 22, pos: vec2(-15, -22), color: rgb(20, 20, 20) });
            // Head (Skin)
            drawRect({ width: 22, height: 22, pos: vec2(-11, -44), color: rgb(255, 220, 177) });
            // Hair (Dark Brown)
            drawRect({ width: 26, height: 10, pos: vec2(-13, -46), color: rgb(50, 40, 40) });
            // Hair Sides
            drawRect({ width: 8, height: 30, pos: vec2(-13, -40), color: rgb(50, 40, 40) });
            drawRect({ width: 8, height: 30, pos: vec2(5, -40), color: rgb(50, 40, 40) });
            // RED FLOWER
            drawCircle({ radius: 8, pos: vec2(12, -40), color: rgb(255, 0, 50) });
        });

        // --- CAMERA ---
        player.onUpdate(() => {
            // Lock camera directly to player (no smoothing to prevent "blue screen" effect)
            camPos(player.pos);
            
            // Respawn if falls
            if (player.pos.y > 1000) {
                go("main");
            }
        });

        // --- CONTROLS ---
        onKeyDown("left", () => player.move(-player.speed, 0));
        onKeyDown("right", () => player.move(player.speed, 0));
        onKeyDown("a", () => player.move(-player.speed, 0));
        onKeyDown("d", () => player.move(player.speed, 0));
        
        function jump() {
            if (player.isGrounded()) {
                player.jump();
            }
        }
        
        onKeyPress("space", jump);
        onKeyPress("up", jump);
        onKeyPress("w", jump);

        // --- UI MESSAGES ---
        const textBox = add([
            rect(width() - 100, 100, { radius: 8 }),
            anchor("bottom"),
            pos(center().x, height() - 20),
            color(0, 0, 0),
            opacity(0),
            fixed(),
            z(100)
        ]);
        
        const textMessage = add([
            text("", { size: 24, width: width() - 120, align: "center" }),
            anchor("bottom"),
            pos(center().x, height() - 50),
            color(255, 255, 255),
            opacity(0),
            fixed(),
            z(101)
        ]);

        function showMessage(txt) {
            textBox.opacity = 0.8;
            textMessage.opacity = 1;
            textMessage.text = txt;
            wait(3, () => {
                 textBox.opacity = 0;
                 textMessage.opacity = 0;
            });
        }

        // --- COLLISIONS ---
        player.onCollide("hazard", () => {
            shake(20);
            go("main");
        });

        player.onCollide("boyfriend", (bf) => {
            if (!bf.hasSpoken) {
                let msg = boyfriendMessages[messageIndex] || "I love you! <3";
                showMessage(msg);
                bf.hasSpoken = true;
                messageIndex++;
                if (messageIndex >= boyfriendMessages.length) {
                    wait(4, () => go("win"));
                }
            }
        });
    });

    // Win Scene
    scene("win", () => {
        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center" }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        
        // Simple confetti
        loop(0.1, () => {
            add([
                rect(10, 10),
                pos(rand(0, width()), 0),
                color(rand(0, 255), rand(0, 255), rand(0, 255)),
                move(DOWN, rand(100, 300)),
                offscreen({ destroy: true })
            ])
        });

        onKeyPress("space", () => go("main"));
    });

    // Start Game
    go("main");
    
    // Ensure window focus
    window.focus();
    onClick(() => window.focus());

</script>
</body>
</html>
