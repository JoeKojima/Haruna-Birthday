<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Adventure! ❤️</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #instruction {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            pointer-events: none;
            z-index: 1000;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

<script type="module">
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

    kaboom({
        background: [88, 112, 152], // Gen 1 Pokemon map color
        scale: 2,
        crisp: true,
    });

    // Load Assets
    loadSprite("player", "haruna_standing.png");
    loadSprite("joe", "joe.png");

    scene("main", () => {
        
        onClick(() => {
            const instr = document.getElementById("instruction");
            if (instr) instr.style.display = "none";
        });

        // Gen 1 Pokemon-style Map
        // # : Trees/Forest
        // = : Path/Walkable ground
        // ~ : Water
        // ^ : Tall Grass
        // @ : Joe NPC
        // ! : Goal (like a Pokeball or town entrance)
        
        const levelLayout = [
            "######################",
            "######################",
            "###=======#####===#####",
            "###==@====#####===####",
            "###=======#####===####",
            "####==######===^^^####",
            "####==######===^^^####",
            "##====###===^^^===####",
            "##====###^^^~~~^^^####",
            "##==========~~~===####",
            "##===@======~~~===####",
            "##==========~~~^^^####",
            "####==######^^^===####",
            "####==############====",
            "####==###====@====####",
            "####==###=========####",
            "####==###======!==####",
            "######################",
            "######################",
        ];

        const messages = [
            "Hey! I've been waiting for you!",
            "You're doing great! Keep exploring!",
            "Almost there... the surprise is close!"
        ];

        let messageIndex = 0;

        addLevel(levelLayout, {
            tileWidth: 32,
            tileHeight: 32,
            tiles: {
                // Trees/Forest (dark green blocks)
                "#": () => [ 
                    rect(32, 32), 
                    color(48, 98, 48), // Dark forest green
                    outline(2, color(32, 64, 32)),
                    area(), 
                    body({ isStatic: true }), 
                    "wall"
                ],
                // Path (light tan/beige like Gen 1)
                "=": () => [ 
                    rect(32, 32), 
                    color(200, 184, 136),
                    outline(1, color(176, 160, 112)),
                ],
                // Water
                "~": () => [ 
                    rect(32, 32), 
                    color(80, 120, 184),
                    outline(1, color(64, 96, 152)),
                    area(), 
                    body({ isStatic: true }), 
                    "wall"
                ],
                // Tall Grass
                "^": () => [ 
                    rect(32, 32), 
                    color(120, 152, 88),
                    outline(1, color(96, 128, 72)),
                ],
                // Joe NPC
                "@": () => [ 
                    sprite("joe"), 
                    scale(0.15),
                    anchor("center"), 
                    area({ scale: 0.6 }), 
                    body({ isStatic: true }),
                    "joe", 
                    { 
                        msg: messages[messageIndex++ % messages.length],
                        hasSpoken: false 
                    }
                ],
                // Goal 
                "!": () => [ 
                    rect(28, 28), 
                    color(255, 64, 64), 
                    outline(3, color(255, 255, 255)),
                    anchor("center"), 
                    area(), 
                    body({ isStatic: true }), 
                    "goal",
                    {
                        update() {
                            this.opacity = 0.5 + Math.sin(time() * 4) * 0.5;
                        }
                    }
                ]
            }
        });

        // Player (top-down view)
        const player = add([
            sprite("player"),
            pos(160, 160),
            area({ scale: 0.6 }),
            body({ isStatic: true }), // No gravity in top-down
            anchor("center"),
            scale(0.15),
            "player",
            {
                speed: 120,
            }
        ]);

        // Camera follow
        player.onUpdate(() => {
            camPos(player.pos);
        });

        // Top-down movement (4-directional like Gen 1 Pokemon)
        let isMoving = false;

        onKeyDown("left", () => {
            if (!isMoving) {
                player.move(-player.speed, 0);
            }
        });
        onKeyDown("a", () => {
            if (!isMoving) {
                player.move(-player.speed, 0);
            }
        });

        onKeyDown("right", () => {
            if (!isMoving) {
                player.move(player.speed, 0);
            }
        });
        onKeyDown("d", () => {
            if (!isMoving) {
                player.move(player.speed, 0);
            }
        });

        onKeyDown("up", () => {
            if (!isMoving) {
                player.move(0, -player.speed);
            }
        });
        onKeyDown("w", () => {
            if (!isMoving) {
                player.move(0, -player.speed);
            }
        });

        onKeyDown("down", () => {
            if (!isMoving) {
                player.move(0, player.speed);
            }
        });
        onKeyDown("s", () => {
            if (!isMoving) {
                player.move(0, player.speed);
            }
        });

        // Prevent walking through walls
        player.onCollide("wall", () => {
            player.pos = player.pos; // Simple collision stop
        });

        // Speech bubble system
        let currentBubble = null;
        let currentBubbleText = null;

        function createSpeechBubble(joeObj, message) {
            if (currentBubble) {
                destroy(currentBubble);
                destroy(currentBubbleText);
            }

            currentBubble = add([
                rect(200, 60, { radius: 4 }),
                anchor("bot"),
                pos(joeObj.pos.x, joeObj.pos.y - 25),
                color(255, 255, 255),
                outline(2, color(0, 0, 0)),
                z(100),
                fixed()
            ]);

            currentBubbleText = add([
                text(message, { size: 10, width: 190, align: "center" }),
                anchor("center"),
                pos(joeObj.pos.x, joeObj.pos.y - 55),
                color(0, 0, 0),
                z(101),
                fixed()
            ]);

            wait(3, () => {
                if (currentBubble) {
                    destroy(currentBubble);
                    destroy(currentBubbleText);
                    currentBubble = null;
                    currentBubbleText = null;
                }
            });
        }

        // Interaction with Joe
        player.onCollide("joe", (joeObj) => {
            if (!joeObj.hasSpoken) {
                createSpeechBubble(joeObj, joeObj.msg);
                joeObj.hasSpoken = true;
            }
        });

        // Win
        player.onCollide("goal", () => {
            go("win");
        });
    });

    // Celebration Scene
    scene("win", () => {
        // Pixelated confetti
        function spawnConfetti() {
            add([
                rect(rand(4, 8), rand(4, 8)),
                pos(rand(0, width()), rand(0, height())),
                color(rand(0, 255), rand(0, 255), rand(0, 255)),
                area(),
                move(DOWN, rand(50, 150)),
                offscreen({ destroy: true }),
            ]);
            wait(0.05, spawnConfetti);
        }
        spawnConfetti();

        add([
            text("HAPPY BIRTHDAY!", { size: 24, align: "center" }),
            pos(center()),
            anchor("center"),
            color(255, 224, 32)
        ]);
        
        add([
            text("You found the surprise!", { size: 12 }),
            pos(center().x, center().y + 40),
            anchor("center"),
            color(255, 255, 255)
        ]);

        add([
            text("Press SPACE to play again", { size: 10 }),
            pos(center().x, center().y + 80),
            anchor("center"),
            color(200, 200, 200)
        ]);

        onKeyPress("space", () => go("main"));
    });

    go("main");
    focus();

</script>
</body>
</html>
