<!DOCTYPE html>
<html>
<head>
    <title>Birthday Adventure! ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        /* Loading / Start Screen */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1000;
        }
        #instruction {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            pointer-events: auto;
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background: #ff69b4;
            border: none;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="instruction">
        <h1>Happy Birthday! ❤️</h1>
        <p>Use <b>Arrow Keys</b> to Move</p>
        <p>Press <b>Space</b> to Jump</p>
        <button onclick="startGame()">CLICK TO START</button>
    </div>
</div>

<script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>

<script>
    // 2. Initialize Game (global: true allows us to use functions without 'k.')
    kaboom({
        background: [135, 206, 235], // Sky Blue
        scale: 1.5,
        global: true, // This is CRITICAL for the code below to work
    });

    // 3. Define the "Start" function triggered by the button
    window.startGame = function() {
        document.getElementById("ui-layer").style.display = "none";
        
        // Focus the canvas so keys work immediately
        const canvas = document.querySelector("canvas");
        if (canvas) canvas.focus();
        
        // Start the music or game loop here if needed
        go("main");
    };

    // 4. Define the Game Scene
    scene("main", () => {
        // Setup Physics
        setGravity(2000);

        // --- LEVEL LAYOUT ---
        // B = Boyfriend, ^ = Spikes, = = Ground
        const levelLayout = [
            "                                      ",
            "                                      ",
            "           B                          ",
            "       =========                      ",
            "                                      ",
            "                       B              ",
            "                   ========           ",
            "      B                               ",
            "======================================",
            "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
        ];

        // Messages
        const boyfriendMessages = [
            "Happy Birthday! Keep going! -->",
            "You look beautiful with that flower! <3",
            "Almost there! I have a surprise at the end.",
        ];
        let messageIndex = 0;

        // Draw Level
        addLevel(levelLayout, {
            tileWidth: 40,
            tileHeight: 40,
            tiles: {
                "=": () => [ 
                    rect(40, 40), 
                    color(34, 139, 34), // Green Ground
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                "^": () => [ 
                    rect(40, 40), 
                    color(255, 0, 0), // Red Spikes
                    area(), 
                    body({ isStatic: true }), 
                    "hazard" 
                ],
                "B": () => [
                    rect(30, 50), 
                    color(0, 0, 255), // Blue Boyfriend placeholder
                    area(),
                    body({ isStatic: true }),
                    anchor("bot"), 
                    "boyfriend",
                    { hasSpoken: false } 
                ]
            }
        });

        // --- PLAYER (Custom Drawing) ---
        const player = add([
            rect(30, 50), // Invisible hitbox
            color(0, 0, 0, 0), 
            pos(100, 0), 
            area(), 
            body({ jumpForce: 900 }), 
            anchor("bot"), 
            "player",
            { speed: 300 }
        ]);

        // Draw the girlfriend sprite manually (No image file needed!)
        player.onDraw(() => {
            // Black Top
            drawRect({ width: 30, height: 22, pos: vec2(-15, -22), color: rgb(20, 20, 20) });
            // Skin Head
            drawRect({ width: 22, height: 22, pos: vec2(-11, -44), color: rgb(255, 220, 177) });
            // Dark Hair (Back)
            drawRect({ width: 26, height: 10, pos: vec2(-13, -46), color: rgb(50, 40, 40) });
            // Dark Hair (Sides)
            drawRect({ width: 8, height: 30, pos: vec2(-13, -40), color: rgb(50, 40, 40) });
            drawRect({ width: 8, height: 30, pos: vec2(5, -40), color: rgb(50, 40, 40) });
            // Red Flower
            drawCircle({ radius: 8, pos: vec2(12, -40), color: rgb(255, 0, 50) });
        });

        // Camera Logic
        player.onUpdate(() => {
            camPos(player.pos);
            if (player.pos.y > 1000) go("main"); // Respawn if fall
        });

        // Controls
        onKeyDown("left", () => player.move(-player.speed, 0));
        onKeyDown("right", () => player.move(player.speed, 0));
        
        function jump() {
            if (player.isGrounded()) player.jump();
        }
        onKeyPress("space", jump);
        onKeyPress("up", jump);
        onKeyPress("w", jump);

        // --- UI TEXT ---
        const textBox = add([
            rect(width() - 100, 100, { radius: 8 }),
            anchor("bottom"),
            pos(center().x, height() - 20),
            color(0, 0, 0),
            opacity(0),
            fixed(),
            z(100)
        ]);
        
        const textMessage = add([
            text("", { size: 20, width: width() - 120, align: "center" }),
            anchor("bottom"),
            pos(center().x, height() - 45),
            color(255, 255, 255),
            opacity(0),
            fixed(),
            z(101)
        ]);

        function showMessage(txt) {
            textBox.opacity = 0.8;
            textMessage.opacity = 1;
            textMessage.text = txt;
            wait(3, () => {
                 textBox.opacity = 0;
                 textMessage.opacity = 0;
            });
        }

        // --- COLLISIONS ---
        player.onCollide("hazard", () => go("main"));

        player.onCollide("boyfriend", (bf) => {
            if (!bf.hasSpoken) {
                let msg = boyfriendMessages[messageIndex] || "I love you! <3";
                showMessage(msg);
                bf.hasSpoken = true;
                messageIndex++;
                if (messageIndex >= boyfriendMessages.length) {
                    wait(4, () => go("win"));
                }
            }
        });
    });

    scene("win", () => {
        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center", width: width() }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        onKeyPress("space", () => go("main"));
    });

    // Don't start strictly until button press, but we init here
    // We stay on "blue" screen behind the UI until user clicks start
</script>
</body>
</html>
