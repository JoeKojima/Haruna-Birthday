<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Adventure! ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }
        #instruction {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

<div id="instruction">Click anywhere to start!<br><small>(Arrows/WASD to Move & SPACE to Jump)</small></div>

<script type="module">
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

    // 1. Initialize Game
    kaboom({
        background: [135, 206, 235], // "Terraria" Sky Blue
        scale: 1,
    });

    // 2. Load Assets (Using standard Kaboom assets for reliability)
    loadSprite("player", "https://kaboomjs.com/sprites/bean.png"); // The classic bean character
    loadSprite("heart", "https://kaboomjs.com/sprites/heart.png"); // Heart sprite
    
    // We will procedurally generate the ground blocks to look like pixel art
    // to ensure the game works without needing to download external texture files.

    // 3. Main Game Scene
    scene("main", () => {
        
        // Enable Gravity (The key to side-scrollers)
        setGravity(2000);

        // Hide instruction
        onClick(() => {
            const instr = document.getElementById("instruction");
            if (instr) instr.style.display = "none";
        });

        // --- LEVEL DESIGN ---
        // = : Grass Block (Top layer)
        // # : Dirt Block (Underground)
        // - : Floating Platform
        // * : Heart (Message)
        // ! : The Surprise (Goal)
        
        const levelLayout = [
            "                                                                     ",
            "                                                                     ",
            "                                   * ",
            "                                 ===                                 ",
            "                                                                     ",
            "                  * ===                 ===                    ",
            "                ====                                  !              ",
            "                                                    =====            ",
            "       * ==                                   #######           ",
            "     ====                 ===         ===         #########          ",
            "                                                 ###########         ",
            "===========  ================   ============================  =======",
            "###########  ################   ############################  #######",
            "###########  ################   ############################  #######",
        ];

        const messages = {
            "1": "I love you so much! <3", 
            "2": "You make me the happiest person.",
            "3": "Keep going! Almost there!",
            "final": "Happy Birthday my love! You found the surprise!"
        };
        const messageList = Object.values(messages);

        // Define the Map
        addLevel(levelLayout, {
            tileWidth: 48,
            tileHeight: 48,
            tiles: {
                // Grass Block (Green with brown bottom)
                "=": () => [ 
                    rect(48, 48), 
                    color(34, 139, 34), // Forest Green
                    outline(4, color(20, 100, 20)), // Pixel border
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                // Dirt Block (Brown)
                "#": () => [ 
                    rect(48, 48), 
                    color(139, 69, 19), // Saddle Brown
                    outline(4, color(100, 50, 10)), 
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                // Heart
                "*": () => [ 
                    sprite("heart"), 
                    scale(2),
                    anchor("center"), 
                    area(), 
                    body({ isStatic: true }), // Static so gravity doesn't pull it down
                    "message", 
                    { msg: messageList[Math.floor(Math.random() * (messageList.length - 1))] },
                    // Make it bob up and down slightly
                    {
                        update() {
                            this.pos.y += Math.sin(time() * 4) * 0.5;
                        }
                    }
                ],
                // The Goal
                "!": () => [ 
                    rect(50, 50), 
                    color(255, 215, 0), 
                    outline(4, color(255, 255, 255)),
                    anchor("center"), 
                    area(), 
                    body({ isStatic: true }), 
                    "goal",
                    // Spin effect
                    {
                        update() {
                            this.angle += 120 * dt();
                        }
                    }
                ]
            }
        });

        // --- PLAYER ---
        const player = add([
            sprite("player"),
            pos(100, 200), // Start position
            area(),
            body(), // enables gravity and physics
            anchor("center"),
            "player"
        ]);

        // Camera Follow
        player.onUpdate(() => {
            // Smoothly follow player
            camPos(player.pos.x, 400); // Lock Y camera slightly so we don't get dizzy
            
            // Fail condition: Falling into a pit
            if (player.pos.y > 1000) {
                go("lose");
            }
        });

        // --- CONTROLS ---
        const SPEED = 400;
        const JUMP_FORCE = 900;

        onKeyDown("left", () => {
            player.move(-SPEED, 0);
            player.flipX = true; // Face left
        });
        onKeyDown("a", () => {
            player.move(-SPEED, 0);
            player.flipX = true;
        });

        onKeyDown("right", () => {
            player.move(SPEED, 0);
            player.flipX = false; // Face right
        });
        onKeyDown("d", () => {
            player.move(SPEED, 0);
            player.flipX = false;
        });

        // Jump Logic
        function jump() {
            if (player.isGrounded()) {
                player.jump(JUMP_FORCE);
            }
        }

        onKeyPress("space", jump);
        onKeyPress("w", jump);
        onKeyPress("up", jump);

        // --- UI TEXT BOX ---
        const textBox = add([
            rect(width() - 200, 120, { radius: 8 }),
            anchor("center"),
            pos(center().x, 100), // Top of screen
            color(0, 0, 0),
            opacity(0),
            fixed(), 
            z(100)
        ]);
        
        const textMessage = add([
            text("", { size: 24, width: width() - 250, align: "center" }),
            anchor("center"),
            pos(center().x, 100),
            color(255, 255, 255),
            opacity(0),
            fixed(),
            z(101)
        ]);

        // Interaction
        player.onCollide("message", (msgObj) => {
            textBox.opacity = 0.8;
            textMessage.opacity = 1;
            textMessage.text = msgObj.msg;
            destroy(msgObj); // Remove the heart after collecting
        });

        // Win
        player.onCollide("goal", () => {
            go("win");
        });
    });

    // Lose Scene (Fell off map)
    scene("lose", () => {
        add([
            text("Oops! You fell.", { size: 48 }),
            pos(center()),
            anchor("center"),
        ]);
        add([
            text("Press Space to Try Again", { size: 24 }),
            pos(center().x, center().y + 100),
            anchor("center"),
        ]);
        onKeyPress("space", () => go("main"));
    });

    // Celebration Scene
    scene("win", () => {
        function spawnConfetti() {
            add([
                rect(rand(10, 20), rand(10, 20)),
                pos(rand(0, width()), rand(0, height())),
                color(rand(0, 255), rand(0, 255), rand(0, 255)),
                area(),
                move(DOWN, rand(50, 200)),
                offscreen({ destroy: true }),
            ]);
            wait(0.05, spawnConfetti);
        }
        spawnConfetti();

        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center", width: width() - 50 }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        
        add([
            text("Press Space to Replay", { size: 24 }),
            pos(center().x, center().y + 100),
            anchor("center"),
            color(0, 0, 0)
        ]);

        onKeyPress("space", () => go("main"));
    });

    // Start
    go("main");
    focus();

</script>
</body>
</html>
