<!DOCTYPE html>
<html>
<head>
    <title>Birthday Adventure! ❤️</title>
    <style>
        /* Make the "loading" background black so we know if the Blue Sky is actually the game running */
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>

<script>
    // 1. Initialize Game
    kaboom({
        background: [135, 206, 235], // Sky Blue
        scale: 1.5,
        global: true, // IMPORTANT: Makes all functions work globally
        debug: true,  // Shows FPS counter in corner (so you know it's running)
    });

    // 2. Define Assets and Scene
    scene("main", () => {
        setGravity(2400); // Strong gravity

        // --- BACKGROUND CLOUDS (To show movement) ---
        // We add these first so they are behind everything
        add([
            circle(50),
            pos(200, 100),
            color(255, 255, 255),
            opacity(0.5),
            "cloud"
        ]);
        add([
            circle(30),
            pos(500, 300),
            color(255, 255, 255),
            opacity(0.5),
            "cloud"
        ]);

        // --- LEVEL LAYOUT ---
        const levelLayout = [
            "                                      ",
            "                                      ",
            "                                      ",
            "                                      ",
            "           B                          ",
            "       =========                      ",
            "                                      ",
            "                       B              ",
            "                   ========           ",
            "      B                               ",
            "======================================",
            "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
        ];

        const boyfriendMessages = [
            "Happy Birthday! Keep going! -->",
            "You look beautiful today! <3",
            "Almost there! Surprise at the end!",
        ];
        let messageIndex = 0;

        addLevel(levelLayout, {
            tileWidth: 40,
            tileHeight: 40,
            tiles: {
                "=": () => [ 
                    rect(40, 40), 
                    color(34, 139, 34), // Green Ground
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                "^": () => [ 
                    rect(40, 40), 
                    color(255, 0, 0), // Red Spikes
                    area(), 
                    body({ isStatic: true }), 
                    "hazard" 
                ],
                "B": () => [
                    rect(30, 50), 
                    color(0, 0, 255), // Blue Boyfriend 
                    area(),
                    body({ isStatic: true }),
                    anchor("bot"), 
                    "boyfriend",
                    { hasSpoken: false } 
                ]
            }
        });

        // --- PLAYER ---
        const player = add([
            // Base shape (Pink Box) - Ensures she is visible even if art fails
            rect(30, 50), 
            color(255, 182, 193), 
            pos(100, 0), // Start in the sky
            area(), 
            body({ jumpForce: 900 }), 
            anchor("bot"), 
            "player",
            { speed: 300 }
        ]);

        // --- ART ON TOP ---
        player.onDraw(() => {
            // Draw over the pink box with the custom character
            // Black Top
            drawRect({ width: 30, height: 22, pos: vec2(-15, -22), color: rgb(20, 20, 20) });
            // Head
            drawRect({ width: 22, height: 22, pos: vec2(-11, -44), color: rgb(255, 220, 177) });
            // Hair
            drawRect({ width: 26, height: 10, pos: vec2(-13, -46), color: rgb(50, 40, 40) });
            drawRect({ width: 8, height: 30, pos: vec2(-13, -40), color: rgb(50, 40, 40) });
            drawRect({ width: 8, height: 30, pos: vec2(5, -40), color: rgb(50, 40, 40) });
            // Red Flower
            drawCircle({ radius: 8, pos: vec2(12, -40), color: rgb(255, 0, 50) });
        });

        // --- CAMERA ---
        player.onUpdate(() => {
            camPos(player.pos);
            // Respawn if falls
            if (player.pos.y > 1000) go("main");
        });

        // --- CONTROLS ---
        onKeyDown("left", () => player.move(-player.speed, 0));
        onKeyDown("right", () => player.move(player.speed, 0));
        onKeyDown("a", () => player.move(-player.speed, 0));
        onKeyDown("d", () => player.move(player.speed, 0));
        
        function jump() {
            if (player.isGrounded()) player.jump();
        }
        
        onKeyPress("space", jump);
        onKeyPress("up", jump);
        onKeyPress("w", jump);

        // --- UI MESSAGES ---
        const textBox = add([
            rect(width() - 100, 100, { radius: 8 }),
            anchor("bottom"),
            pos(center().x, height() - 20),
            color(0, 0, 0),
            opacity(0),
            fixed(),
            z(100)
        ]);
        
        const textMessage = add([
            text("", { size: 24, width: width() - 120, align: "center" }),
            anchor("bottom"),
            pos(center().x, height() - 50),
            color(255, 255, 255),
            opacity(0),
            fixed(),
            z(101)
        ]);

        function showMessage(txt) {
            textBox.opacity = 0.8;
            textMessage.opacity = 1;
            textMessage.text = txt;
            wait(3, () => {
                 textBox.opacity = 0;
                 textMessage.opacity = 0;
            });
        }

        // --- INTERACTIONS ---
        player.onCollide("hazard", () => go("main"));

        player.onCollide("boyfriend", (bf) => {
            if (!bf.hasSpoken) {
                let msg = boyfriendMessages[messageIndex] || "I love you! <3";
                showMessage(msg);
                bf.hasSpoken = true;
                messageIndex++;
                if (messageIndex >= boyfriendMessages.length) {
                    wait(4, () => go("win"));
                }
            }
        });
    });

    scene("win", () => {
        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center", width: width() }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        onKeyPress("space", () => go("main"));
    });

    // Start
    go("main");
    
    // Force Focus
    window.focus();
    onClick(() => window.focus());

</script>
</body>
</html>
