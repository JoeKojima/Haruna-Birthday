<!DOCTYPE html>
<html>
<head>
    <title>Birthday Adventure! ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #instruction {
            position: absolute;
            top: 20%; width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="instruction">Click to Start!<br><small>Use Arrow Keys/WASD to move, SPACE to jump</small></div>

<script type="module">
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

    kaboom({
        background: [135, 206, 235], // Sky blue
        scale: 1.5,
    });

    scene("main", () => {
        onClick(() => document.getElementById("instruction").style.display = "none");

        // Physics: High gravity makes the jump feel snappy
        setGravity(2000);

        const levelLayout = [
            "                                      ",
            "                                      ",
            "           B                          ",
            "       =========                      ",
            "                                      ",
            "                       B              ",
            "                   ========           ",
            "      B                               ",
            "======================================",
            "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
        ];

        const boyfriendMessages = [
            "Happy Birthday! Keep going! -->",
            "You look beautiful with that flower! <3",
            "Almost there! I have a surprise at the end.",
        ];
        let messageIndex = 0;

        addLevel(levelLayout, {
            tileWidth: 40,
            tileHeight: 40,
            tiles: {
                "=": () => [ 
                    rect(40, 40), 
                    color(34, 139, 34), 
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                "^": () => [ 
                    rect(40, 40), 
                    color(255, 0, 0), 
                    area(), 
                    body({ isStatic: true }), 
                    "hazard" 
                ],
                "B": () => [
                    rect(30, 50), 
                    color(0, 0, 255), 
                    area(),
                    body({ isStatic: true }),
                    anchor("bot"), 
                    "boyfriend",
                    { hasSpoken: false } 
                ]
            }
        });

        // --- PLAYER CHARACTER ---
        const player = add([
            // Hitbox (Invisible, we draw the art manually below)
            rect(30, 50), 
            color(0, 0, 0, 0), // Invisible rect
            pos(100, 0), 
            area(), 
            // jumpForce is set HERE inside body(). No duplicate properties!
            body({ jumpForce: 900 }), 
            anchor("bot"), 
            "player",
            { speed: 300 }
        ]);

        // --- CUSTOM DRAWING FUNCTION ---
        // This draws her "Sprite" using shapes instead of an image file.
        // It prevents the "drawImage" crash.
        player.onDraw(() => {
            // 1. Body (Black Top)
            drawRect({
                width: 30, height: 22,
                pos: vec2(-15, -22), // Relative to player center
                color: rgb(20, 20, 20)
            });
            // 2. Head (Skin Tone)
            drawRect({
                width: 22, height: 22,
                pos: vec2(-11, -44),
                color: rgb(255, 220, 177)
            });
            // 3. Hair (Dark Brown - Back)
            drawRect({
                width: 26, height: 10,
                pos: vec2(-13, -46),
                color: rgb(50, 40, 40)
            });
            // 4. Hair (Long sides)
            drawRect({
                width: 8, height: 30,
                pos: vec2(-13, -40),
                color: rgb(50, 40, 40)
            });
            drawRect({
                width: 8, height: 30,
                pos: vec2(5, -40),
                color: rgb(50, 40, 40)
            });
            // 5. THE FLOWER (Red Hibiscus on the right)
            drawCircle({
                radius: 8,
                pos: vec2(12, -40),
                color: rgb(255, 0, 50) 
            });
        });

        // Camera Follow
        player.onUpdate(() => {
            camPos(lerp(camPos(), player.pos, 0.1));
            if (player.pos.y > height() + 200) go("main");
        });

        // Controls
        onKeyDown("left", () => player.move(-player.speed, 0));
        onKeyDown("right", () => player.move(player.speed, 0));

        function jump() {
            if (player.isGrounded()) {
                player.jump(); 
            }
        }
        
        onKeyPress("up", jump);
        onKeyPress("w", jump);
        onKeyPress("space", jump);

        // --- UI & MESSAGES ---
        const textBox = add([
            rect(width() - 100, 100, { radius: 8 }),
            anchor("bottom"),
            pos(center().x, height() - 20),
            color(0, 0, 0),
            opacity(0),
            fixed(), 
            z(100)
        ]);
        
        const textMessage = add([
            text("", { size: 20, width: width() - 120, align: "center" }),
            anchor("bottom"),
            pos(center().x, height() - 45),
            color(255, 255, 255),
            opacity(0),
            fixed(),
            z(101)
        ]);

        function showMessage(txt) {
            textBox.opacity = 0.8;
            textMessage.opacity = 1;
            textMessage.text = txt;
            wait(3, () => {
                 textBox.opacity = 0;
                 textMessage.opacity = 0;
            })
        }

        player.onCollide("hazard", () => go("main"));

        player.onCollide("boyfriend", (bf) => {
            if (!bf.hasSpoken) {
                let msg = boyfriendMessages[messageIndex] || "I love you! <3";
                showMessage(msg);
                bf.hasSpoken = true;
                messageIndex++;
                if (messageIndex >= boyfriendMessages.length) {
                     wait(4, () => go("win"));
                }
            }
        });
    });

    scene("win", () => {
        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center" }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        
        // Confetti!
        function spawnConfetti() {
            add([
                rect(rand(10, 20), rand(10, 20)),
                pos(rand(0, width()), -20),
                color(rand(0, 255), rand(0, 255), rand(0, 255)),
                area(),
                move(DOWN, rand(100, 300)),
                offscreen({ destroy: true }),
            ]);
            wait(0.1, spawnConfetti);
        }
        spawnConfetti();

        onKeyPress("space", () => go("main"));
    });

    go("main");
    focus();

</script>
</body>
</html>
