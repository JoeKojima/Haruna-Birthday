<!DOCTYPE html>
<html>
<head>
    <title>Birthday Adventure! ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
    </style>
</head>
<body>

<script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>

<script>
    // 1. Initialize Game
    kaboom({
        background: [135, 206, 235], // Sky Blue
        scale: 1.5,
        global: true, // Allows us to code without complex imports
    });

    // 2. Define the Game Level
    scene("main", () => {
        
        // Physics: High gravity for snappy platforming
        setGravity(2000);

        // --- LEVEL LAYOUT ---
        // B = Boyfriend, ^ = Spikes, = = Ground
        const levelLayout = [
            "                                      ",
            "                                      ",
            "           B                          ",
            "       =========                      ",
            "                                      ",
            "                       B              ",
            "                   ========           ",
            "      B                               ",
            "======================================",
            "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
        ];

        // Messages
        const boyfriendMessages = [
            "Happy Birthday! Keep going! -->",
            "You look beautiful with that flower! <3",
            "Almost there! I have a surprise at the end.",
        ];
        let messageIndex = 0;

        // Draw the map
        addLevel(levelLayout, {
            tileWidth: 40,
            tileHeight: 40,
            tiles: {
                "=": () => [ 
                    rect(40, 40), 
                    color(34, 139, 34), // Green Ground
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                "^": () => [ 
                    rect(40, 40), 
                    color(255, 0, 0), // Red Spikes
                    area(), 
                    body({ isStatic: true }), 
                    "hazard" 
                ],
                "B": () => [
                    rect(30, 50), 
                    color(0, 0, 255), // Blue Boyfriend placeholder
                    area(),
                    body({ isStatic: true }),
                    anchor("bot"), 
                    "boyfriend",
                    { hasSpoken: false } 
                ]
            }
        });

        // --- PLAYER ---
        const player = add([
            rect(30, 50),       // Invisible hitbox area
            color(0, 0, 0, 0),  // Make the box transparent
            pos(100, 0),        // Start in the AIR (Y=0), so she falls down!
            area(), 
            body({ jumpForce: 900 }), 
            anchor("bot"), 
            "player",
            { speed: 300 }
        ]);

        // --- CUSTOM DRAWING (The Girlfriend) ---
        // This draws her features manually to match your photo
        player.onDraw(() => {
            // Black Top
            drawRect({ width: 30, height: 22, pos: vec2(-15, -22), color: rgb(20, 20, 20) });
            // Skin (Head)
            drawRect({ width: 22, height: 22, pos: vec2(-11, -44), color: rgb(255, 220, 177) });
            // Dark Hair (Back)
            drawRect({ width: 26, height: 10, pos: vec2(-13, -46), color: rgb(50, 40, 40) });
            // Dark Hair (Long Sides)
            drawRect({ width: 8, height: 30, pos: vec2(-13, -40), color: rgb(50, 40, 40) });
            drawRect({ width: 8, height: 30, pos: vec2(5, -40), color: rgb(50, 40, 40) });
            // The Red Flower (Hibiscus)
            drawCircle({ radius: 8, pos: vec2(12, -40), color: rgb(255, 0, 50) });
        });

        // Camera follows player
        player.onUpdate(() => {
            camPos(player.pos);
            // If she falls off the map, respawn
            if (player.pos.y > 1000) go("main");
        });

        // --- CONTROLS ---
        onKeyDown("left", () => player.move(-player.speed, 0));
        onKeyDown("right", () => player.move(player.speed, 0));
        onKeyDown("a", () => player.move(-player.speed, 0));
        onKeyDown("d", () => player.move(player.speed, 0));
        
        function jump() {
            if (player.isGrounded()) player.jump();
        }
        onKeyPress("space", jump);
        onKeyPress("up", jump);
        onKeyPress("w", jump);

        // --- TEXT BOX UI ---
        const textBox = add([
            rect(width() - 100, 100, { radius: 8 }),
            anchor("bottom"),
            pos(center().x, height() - 20),
            color(0, 0, 0),
            opacity(0),
            fixed(),
            z(100)
        ]);
        
        const textMessage = add([
            text("", { size: 20, width: width() - 120, align: "center" }),
            anchor("bottom"),
            pos(center().x, height() - 45),
            color(255, 255, 255),
            opacity(0),
            fixed(),
            z(101)
        ]);

        function showMessage(txt) {
            textBox.opacity = 0.8;
            textMessage.opacity = 1;
            textMessage.text = txt;
            wait(3, () => {
                 textBox.opacity = 0;
                 textMessage.opacity = 0;
            });
        }

        // --- INTERACTIONS ---
        player.onCollide("hazard", () => go("main"));

        player.onCollide("boyfriend", (bf) => {
            if (!bf.hasSpoken) {
                let msg = boyfriendMessages[messageIndex] || "I love you! <3";
                showMessage(msg);
                bf.hasSpoken = true;
                messageIndex++;
                if (messageIndex >= boyfriendMessages.length) {
                    wait(4, () => go("win"));
                }
            }
        });
    });

    // Celebration Screen
    scene("win", () => {
        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center", width: width() }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        
        function spawnConfetti() {
            add([
                rect(rand(10, 20), rand(10, 20)),
                pos(rand(0, width()), -20),
                color(rand(0, 255), rand(0, 255), rand(0, 255)),
                area(),
                move(DOWN, rand(100, 300)),
                offscreen({ destroy: true }),
            ]);
            wait(0.1, spawnConfetti);
        }
        spawnConfetti();

        onKeyPress("space", () => go("main"));
    });

    // 3. Start the game immediately!
    go("main");
    
    // Attempt to focus the window so keyboard works instantly
    window.focus();
</script>
</body>
</html>
