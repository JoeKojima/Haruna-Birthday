<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Adventure! ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }
        #instruction {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

<div id="instruction">Use Arrow Keys or WASD to Move & Jump</div>

<script type="module">
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

    // 1. Initialize Game
    kaboom({
        background: [135, 206, 235], // Sky Blue
        scale: 1,
    });

    // 2. Load Assets
    // IMPORTANT: Make sure haruna.png and joe.png are in the same folder as this file!
    loadSprite("player", "haruna_standing.png"); 
    loadSprite("joe", "joe.png");
    
    // We will procedurally generate the ground blocks (no images needed for ground)

    // 3. Main Game Scene
    scene("main", () => {
        
        setGravity(2000);

        // Hide instruction on click
        onClick(() => {
            const instr = document.getElementById("instruction");
            if (instr) instr.style.display = "none";
        });

        // --- LEVEL DESIGN ---
        // = : Grass
        // # : Dirt
        // * : JOE (The NPC)
        // ! : The Goal
        
        const levelLayout = [
            "                                                                     ",
            "                                                                     ",
            "                                   * ",
            "                                 ===                                 ",
            "                                                                     ",
            "                  * ===                 ===                    ",
            "                ====                                  !              ",
            "                                                    =====            ",
            "       * ==                                   #######           ",
            "     ====                 ===         ===         #########          ",
            "                                                 ###########         ",
            "===========  ================   ============================  =======",
            "###########  ################   ############################  #######",
            "###########  ################   ############################  #######",
        ];

        const messages = [
            "I love you so much! <3", 
            "You make me the happiest person.",
            "Keep going! Almost there!",
            "You can do it, Haruna!"
        ];

        // Define the Map
        addLevel(levelLayout, {
            tileWidth: 48,
            tileHeight: 48,
            tiles: {
                // Grass Block
                "=": () => [ 
                    rect(48, 48), 
                    color(34, 139, 34), 
                    outline(4, color(20, 100, 20)), 
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                // Dirt Block
                "#": () => [ 
                    rect(48, 48), 
                    color(139, 69, 19), 
                    outline(4, color(100, 50, 10)), 
                    area(), 
                    body({ isStatic: true }), 
                    "ground" 
                ],
                // JOE (The NPC)
                "*": () => [ 
                    sprite("joe"), 
                    scale(1), // Adjust this if Joe is too big/small
                    anchor("center"), 
                    area(), 
                    body({ isStatic: true }), // Static so he stands on ground
                    "joe", 
                    { 
                        msg: messages[Math.floor(Math.random() * messages.length)],
                        has spoken: false 
                    }
                ],
                // The Goal
                "!": () => [ 
                    rect(50, 50), 
                    color(255, 215, 0), 
                    outline(4, color(255, 255, 255)),
                    anchor("center"), 
                    area(), 
                    body({ isStatic: true }), 
                    "goal",
                    {
                        update() { this.angle += 120 * dt(); }
                    }
                ]
            }
        });

        // --- PLAYER (HARUNA) ---
        const player = add([
            sprite("player"),
            pos(100, 200),
            area(),
            body(),
            anchor("center"),
            "player"
        ]);

        // Camera Follow
        player.onUpdate(() => {
            camPos(player.pos.x, 400);
            if (player.pos.y > 1000) go("lose");
        });

        // --- CONTROLS ---
        const SPEED = 400;
        const JUMP_FORCE = 900;

        onKeyDown("left", () => {
            player.move(-SPEED, 0);
            player.flipX = true;
        });
        onKeyDown("a", () => {
            player.move(-SPEED, 0);
            player.flipX = true;
        });

        onKeyDown("right", () => {
            player.move(SPEED, 0);
            player.flipX = false;
        });
        onKeyDown("d", () => {
            player.move(SPEED, 0);
            player.flipX = false;
        });

        function jump() {
            if (player.isGrounded()) {
                player.jump(JUMP_FORCE);
            }
        }

        onKeyPress("space", jump);
        onKeyPress("w", jump);
        onKeyPress("up", jump);

        // --- INTERACTION: SPEECH BUBBLE ---
        
        player.onCollide("joe", (joe) => {
            // Only speak if he hasn't spoken yet (prevents bubble spam)
            if (joe.hasSpoken) return;
            joe.hasSpoken = true;

            // 1. Create the Bubble Background
            const bubbleWidth = 200;
            const bubbleHeight = 80;

            const bubble = add([
                rect(bubbleWidth, bubbleHeight, { radius: 10 }),
                color(255, 255, 255),
                outline(2, color(0, 0, 0)),
                anchor("center"),
                // Position it 70 pixels above Joe
                pos(joe.pos.x, joe.pos.y - 70), 
                z(100),
                // Optional: Make it disappear after 3 seconds
                lifespan(3, { fade: 0.5 }) 
            ]);

            // 2. Add the Text inside the bubble
            bubble.add([
                text(joe.msg, { 
                    size: 16, 
                    width: bubbleWidth - 20, // Padding
                    align: "center",
                    color: (0,0,0)
                }),
                anchor("center"),
                color(0, 0, 0), // Black Text
            ]);

            // 3. Add a little triangle pointer at bottom of bubble
            add([
                polygon([vec2(-10, 0), vec2(10, 0), vec2(0, 15)]),
                pos(joe.pos.x, joe.pos.y - 32), // Right below the rect
                color(255, 255, 255),
                anchor("top"),
                z(100),
                lifespan(3, { fade: 0.5 })
            ]);
        });

        // Win
        player.onCollide("goal", () => {
            go("win");
        });
    });

    // Lose Scene
    scene("lose", () => {
        add([
            text("Oops! You fell.", { size: 48 }),
            pos(center()),
            anchor("center"),
        ]);
        add([
            text("Press Space to Try Again", { size: 24 }),
            pos(center().x, center().y + 100),
            anchor("center"),
        ]);
        onKeyPress("space", () => go("main"));
    });

    // Celebration Scene
    scene("win", () => {
        function spawnConfetti() {
            add([
                rect(rand(10, 20), rand(10, 20)),
                pos(rand(0, width()), rand(0, height())),
                color(rand(0, 255), rand(0, 255), rand(0, 255)),
                area(),
                move(DOWN, rand(50, 200)),
                offscreen({ destroy: true }),
            ]);
            wait(0.05, spawnConfetti);
        }
        spawnConfetti();

        add([
            text("HAPPY BIRTHDAY!", { size: 48, align: "center", width: width() - 50 }),
            pos(center()),
            anchor("center"),
            color(255, 0, 100)
        ]);
        
        add([
            text("Press Space to Replay", { size: 24 }),
            pos(center().x, center().y + 100),
            anchor("center"),
            color(0, 0, 0)
        ]);

        onKeyPress("space", () => go("main"));
    });

    // Start
    go("main");
    focus();

</script>
</body>
</html>
