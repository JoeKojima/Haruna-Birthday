<!DOCTYPE html>
<html>
<head>
    <title>Birthday Quest ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background: #333; }
    </style>
</head>
<body>

<script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>

<script>
    // 1. Initialize Game
    kaboom({
        background: [135, 206, 235], // Sky Blue
        scale: 1, // Reset scale to 1 to ensure everything fits
        global: true, 
        debug: true, // Shows hitboxes so you can see if things load
    });

    scene("main", () => {
        setGravity(2000);

        // --- 1. THE FLOOR (Hard-coded, cannot disappear) ---
        add([
            rect(width() * 2, 50), // A floor twice the width of the screen
            pos(0, height() - 50),
            color(34, 139, 34), // Green
            area(),
            body({ isStatic: true }),
            "ground"
        ]);

        // --- 2. THE PLATFORMS (Hard-coded) ---
        // Platform 1
        add([
            rect(200, 20),
            pos(400, height() - 200),
            color(34, 139, 34),
            area(),
            body({ isStatic: true }),
            "ground"
        ]);

        // Platform 2
        add([
            rect(200, 20),
            pos(800, height() - 300),
            color(34, 139, 34),
            area(),
            body({ isStatic: true }),
            "ground"
        ]);

        // --- 3. THE PLAYER ---
        const player = add([
            rect(30, 50),
            color(0, 0, 0, 0), // Invisible box
            pos(100, height() - 300), // Spawns in the air, drops down
            area(),
            body({ jumpForce: 900 }),
            anchor("bot"),
            "player",
            { speed: 400 }
        ]);

        // --- DRAW THE GIRLFRIEND ---
        player.onDraw(() => {
            // Black Top
            drawRect({ width: 30, height: 22, pos: vec2(-15, -22), color: rgb(20, 20, 20) });
            // Head (Skin)
            drawRect({ width: 22, height: 22, pos: vec2(-11, -44), color: rgb(255, 220, 177) });
            // Hair (Dark Brown)
            drawRect({ width: 26, height: 10, pos: vec2(-13, -46), color: rgb(50, 40, 40) });
            // Hair Sides
            drawRect({ width: 8, height: 30, pos: vec2(-13, -40), color: rgb(50, 40, 40) });
            drawRect({ width: 8, height: 30, pos: vec2(5, -40), color: rgb(50, 40, 40) });
            // RED FLOWER
            drawCircle({ radius: 8, pos: vec2(12, -40), color: rgb(255, 0, 50) });
        });

        // --- 4. THE BOYFRIENDS (Hard-coded positions) ---
        const boyfriends = [
            { pos: vec2(500, height() - 200), msg: "Happy Birthday! -->" },
            { pos: vec2(900, height() - 300), msg: "You look beautiful! <3" },
            { pos: vec2(1200, height() - 50), msg: "I love you so much!" },
        ];

        boyfriends.forEach((bfData) => {
            add([
                rect(30, 50),
                color(0, 0, 255), // Blue Boyfriend
                pos(bfData.pos),
                area(),
                body({ isStatic: true }),
                anchor("bot"),
                "boyfriend",
                { msg: bfData.msg, hasSpoken: false }
            ]);
        });

        // --- CAMERA ---
        player.onUpdate(() => {
            camPos(player.pos.x + 200, height() / 2); // Camera follows X only, keeps ground in view
            
            // Safety: If she falls, respawn
            if (player.pos.y > height() + 100) {
                player.pos = vec2(100, 0);
                player.vel = vec2(0, 0);
            }
        });

        // --- CONTROLS ---
        onKeyDown("left", () => player.move(-player.speed, 0));
        onKeyDown("right", () => player.move(player.speed, 0));
        onKeyDown("a", () => player.move(-player.speed, 0));
        onKeyDown("d", () => player.move(player.speed, 0));
        
        function jump() {
            if (player.isGrounded()) player.jump();
        }
        onKeyPress("space", jump);
        onKeyPress("up", jump);
        onKeyPress("w", jump);

        // --- UI TEXT ---
        const textBox = add([
            rect(width() - 200, 100, { radius: 8 }),
            anchor("bottom"),
            pos(center().x, height() - 20),
            color(0, 0, 0),
            opacity(0),
            fixed(),
            z(100)
        ]);
        
        const textMessage = add([
            text("", { size: 24, width: width() - 220, align: "center" }),
            anchor("bottom"),
            pos(center().x, height() - 50),
            color(255, 255, 255),
            opacity(0),
            fixed(),
            z(101)
        ]);

        player.onCollide("boyfriend", (bf) => {
            if (!bf.hasSpoken) {
                textBox.opacity = 0.8;
                textMessage.opacity = 1;
                textMessage.text = bf.msg;
                
                wait(3, () => {
                     textBox.opacity = 0;
                     textMessage.opacity = 0;
                });
                bf.hasSpoken = true;
            }
        });
    });

    // Start
    go("main");
    window.focus();

</script>
</body>
</html>
